
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M8 Web Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#0a1028,#172d65);color:white;font-family:Arial,sans-serif}
main{max-width:950px;margin:auto;padding:20px}
header{text-align:center;padding:25px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}
.card{background:#1b3674;border:1px solid #4265a8;border-radius:18px;padding:22px;margin-bottom:15px}
.card h2{margin:10px 0}
.card p{color:#d2def8}
input{width:100%;padding:15px;background:#10244d;color:white;border:1px solid #6687c5;border-radius:10px;font-size:16px}
button{padding:14px 20px;border:0;border-radius:10px;font-weight:bold;margin:12px 8px 0 0;cursor:pointer}
.primary{background:#82dcff;color:#10244d}
.secondary{background:#5777b5;color:white}
#status{margin-top:18px;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:bold}
#profile{margin-top:18px}
#profile img{width:80px;height:80px;border-radius:50%}
#results{white-space:pre-wrap;overflow-wrap:anywhere}
small{display:block;margin-top:12px;color:#c6d8f7;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<header>
<h1>M8 Web Hub</h1>
<p>Seu painel web</p>
</header>

<div class="grid">
<section class="card">
<h2>🏠 Início</h2>
<p>Painel principal.</p>
</section>
<section class="card">
<h2>🔌 Integrações</h2>
<p>Serviços conectados.</p>
</section>
<section class="card">
<h2>🛡️ Privacidade</h2>
<p>Conexões oficiais.</p>
</section>
</div>

<section class="card">
<h2>🎵 Spotify</h2>
<p>Conecte sua conta.</p>
<input id="client" placeholder="Client ID do Spotify">
<button class="primary" id="connect">Conectar Spotify</button>
<button class="secondary" id="logout">Desconectar</button>
<small>Redirect URI: https://m8-web-hub.vercel.app/callback</small>
<div id="status"></div>
<div id="profile"></div>
</section>

<section class="card">
<h2>📸 Instagram</h2>
<p>Integração em preparação.</p>
</section>

<section class="card">
<h2>🧪 Diagnóstico do navegador</h2>
<button class="primary" id="test">Executar diagnóstico</button>
<pre id="results"></pre>
</section>
</main>

<script>
const REDIRECT="https://m8-web-hub.vercel.app/callback";
const AUTH="https://accounts.spotify.com/authorize";
const TOKEN="https://accounts.spotify.com/api/token";
const KEY="m8_spotify_auth";
const $=id=>document.getElementById(id);
const status=t=>$("status").textContent=t;

function random(n){
 const bytes=crypto.getRandomValues(new Uint8Array(n));
 return Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("");
}

async function challenge(v){
 const hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v));
 return btoa(String.fromCharCode(...new Uint8Array(hash)))
 .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

async function connect(){
 const id=$("client").value.trim();
 if(!/^[a-f0-9]{32}$/i.test(id))return status("Client ID inválido.");
 try{
  const verifier=random(32),state=random(16);
  const ch=await challenge(verifier);
  sessionStorage.setItem(KEY,JSON.stringify({id,verifier,state}));
  const q=new URLSearchParams({
   client_id:id,
   response_type:"code",
   redirect_uri:REDIRECT,
   code_challenge_method:"S256",
   code_challenge:ch,
   state
  });
  location.assign(AUTH+"?"+q);
 }catch(e){status("Erro: "+e.message)}
}

async function callback(){
 const p=new URLSearchParams(location.search);
 const saved=sessionStorage.getItem(KEY);
 const error=p.get("error");
 const code=p.get("code");
 const state=p.get("state");
 history.replaceState({},"","/");

 if(error)return status("Spotify: "+error);
 if(!saved)return status("Sessão não encontrada.");

 let auth;
 try{auth=JSON.parse(saved)}
 catch{return status("Sessão inválida.")}

 if(!code||!state||state!==auth.state){
  sessionStorage.removeItem(KEY);
  return status("Falha na verificação de segurança.");
 }

 sessionStorage.removeItem(KEY);
 status("Conectando...");

 try{
  const body=new URLSearchParams({
   grant_type:"authorization_code",
   code,
   redirect_uri:REDIRECT,
   client_id:auth.id,
   code_verifier:auth.verifier
  });
  const r=await fetch(TOKEN,{
   method:"POST",
   headers:{"Content-Type":"application/x-www-form-urlencoded"},
   body
  });
  const data=await r.json();
  if(!r.ok)throw Error(data.error_description||data.error);
  sessionStorage.setItem("m8_token",data.access_token);
  await profile();
 }catch(e){status("Erro: "+e.message)}
}

async function profile(){
 const token=sessionStorage.getItem("m8_token");
 if(!token)return;
 try{
  const r=await fetch("https://api.spotify.com/v1/me",{
   headers:{Authorization:"Bearer "+token}
  });
  if(!r.ok)throw Error("HTTP "+r.status);
  const u=await r.json(),box=$("profile");
  box.replaceChildren();
  if(u.images?.[0]?.url){
   const img=document.createElement("img");
   img.src=u.images[0].url;
   box.append(img);
  }
  const h=document.createElement("h3");
  h.textContent=u.display_name||"Usuário";
  box.append(h);
  status("Spotify conectado!");
 }catch(e){status("Erro: "+e.message)}
}

function logout(){
 sessionStorage.removeItem(KEY);
 sessionStorage.removeItem("m8_token");
 $("profile").replaceChildren();
 status("Desconectado.");
}

function diagnostic(){
 const check=s=>{
  try{s.setItem("test","ok");s.removeItem("test");return "Disponível"}
  catch{return "Indisponível"}
 };
 $("results").textContent=[
  "JavaScript: funcionando",
  "Armazenamento local: "+check(localStorage),
  "Armazenamento de sessão: "+check(sessionStorage),
  "Conexão: "+(navigator.onLine?"online":"offline"),
  "Service Worker: "+("serviceWorker"in navigator?"suportado":"não suportado"),
  "Tela: "+innerWidth+" x "+innerHeight
 ].join("\n");
}

$("connect").onclick=connect;
$("logout").onclick=logout;
$("test").onclick=diagnostic;

if(location.pathname==="/callback")callback();
else profile();
</script>
</body>
</html>
